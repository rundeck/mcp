name: Docker

# Disabled: migrated to .circleci/config.yml (docker-build / docker-release jobs).
# Kept here for reference only — the release job only makes sense when
# dispatched against a `vX.Y.Z` tag ref (Actions UI "Use workflow from" -> tag),
# and it still depends on a matching rundeck/mcp-ci:sha-<sha> image already
# existing from an earlier build.
on:
  workflow_dispatch: {}

jobs:
  check_secrets:
    name: Check required secrets
    runs-on: ubuntu-latest
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
    steps:
      - id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and push to CI repo
    runs-on: ubuntu-latest
    needs: check_secrets
    if: |
      needs.check_secrets.outputs.has_secrets == 'true' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          SHA_TAG="rundeck/mcp-ci:sha-${{ github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH=$(echo "${{ github.head_ref }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
            echo "tags=${SHA_TAG},rundeck/mcp-ci:${BRANCH}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${SHA_TAG},rundeck/mcp-ci:main" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Promote to release repo
    runs-on: ubuntu-latest
    needs: check_secrets
    if: needs.check_secrets.outputs.has_secrets == 'true' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Promote CI image to release
        run: |
          docker buildx imagetools create \
            --tag "rundeck/mcp:${{ steps.version.outputs.version }}" \
            --tag "rundeck/mcp:latest" \
            "rundeck/mcp-ci:sha-${{ github.sha }}"