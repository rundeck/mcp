name: Snyk Security Scan

on:
  pull_request:
  push:

jobs:
  check_secrets:
    name: Check required secrets
    runs-on: ubuntu-latest
    steps:
      - name: Fail if required secrets are missing
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          CLOUDSMITH_NPM_TOKEN: ${{ secrets.CLOUDSMITH_NPM_TOKEN }}
        run: |
          missing=()
          [ -z "$SNYK_TOKEN" ] && missing+=("SNYK_TOKEN")
          [ -z "$CLOUDSMITH_NPM_TOKEN" ] && missing+=("CLOUDSMITH_NPM_TOKEN")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Snyk scan cannot run — missing required secret(s): ${missing[*]}. Configure them in the repository/org settings so security scans actually execute."
            exit 1
          fi
          echo "All required secrets are present."

  snyk_security:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: check_secrets
    permissions:
      contents: read

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      CLOUDSMITH_NPM_TOKEN: ${{ secrets.CLOUDSMITH_NPM_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Snyk CLI
        run: npm install -g snyk@1.1304.1 --userconfig=.npmrc

      - name: Verify Snyk installation
        run: snyk --version

      - name: Authenticate Snyk
        run: snyk auth "$SNYK_TOKEN"

      - name: Run Snyk monitor (default branch only)
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: snyk monitor --all-projects --exclude=docs

      - name: Test for vulnerabilities
        run: snyk test --all-projects --exclude=docs --severity-threshold=high
