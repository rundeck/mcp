name: Snyk Security Scan

on:
  pull_request:
  push:

jobs:
  check_secrets:
    name: Check required secrets
    runs-on: ubuntu-latest
    outputs:
      has_secrets: ${{ steps.check.outputs.has_secrets }}
    steps:
      - id: check
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          CLOUDSMITH_NPM_TOKEN: ${{ secrets.CLOUDSMITH_NPM_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ] && [ -n "$CLOUDSMITH_NPM_TOKEN" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          fi

  snyk_security:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: check_secrets
    if: needs.check_secrets.outputs.has_secrets == 'true'
    permissions:
      contents: read

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      CLOUDSMITH_NPM_TOKEN: ${{ secrets.CLOUDSMITH_NPM_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Snyk CLI
        run: npm install -g snyk@1.1304.1 --userconfig=.npmrc

      - name: Verify Snyk installation
        run: snyk --version

      - name: Authenticate Snyk
        run: snyk auth "$SNYK_TOKEN"

      - name: Run Snyk monitor (default branch only)
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: snyk monitor --all-projects

      - name: Test for vulnerabilities
        run: snyk test --all-projects --severity-threshold=high
