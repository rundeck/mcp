name: Release

# Triggered in two ways:
#   1. Automatically when a Release PR (`release/vX.Y.Z`) is merged into `main`:
#      tags the merge commit with `vX.Y.Z`, pushes the tag (which triggers
#      CircleCI's npm-publish and docker-release jobs when pushed with a token
#      that fires webhooks, or when tagged directly), and creates the GitHub
#      Release from the committed CHANGELOG.md section.
#   2. Directly when a `vX.Y.Z` tag is pushed to the repository:
#      creates the GitHub Release (if not already created) from the committed
#      CHANGELOG.md section.
on:
  pull_request:
    types:
      - closed
    branches:
      - main
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Tag & Create GitHub Release
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v'))
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.ref }}
          fetch-depth: 0

      - name: Resolve version and tag on Release PR merge
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REF_NAME: ${{ github.ref_name }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            TAG="${PR_HEAD_REF#release/}"
          else
            TAG="${REF_NAME}"
          fi

          if ! echo "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '${TAG}' does not match expected vX.Y.Z format."
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # A release may only use notes committed and reviewed in the Release PR.
          node scripts/generate-changelog.mjs --verify-tag "${VERSION}"

          # If triggered by merging the Release PR, create and push the vX.Y.Z tag on the merge commit
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            EXISTING_TAG_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}')"
            if [ -n "${EXISTING_TAG_SHA}" ]; then
              if [ "${EXISTING_TAG_SHA}" != "${MERGE_SHA}" ]; then
                echo "::error::Tag ${TAG} already points to ${EXISTING_TAG_SHA}, not Release PR merge commit ${MERGE_SHA}."
                exit 1
              fi
              echo "Tag ${TAG} already points to Release PR merge commit ${MERGE_SHA}."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag "${TAG}" "${MERGE_SHA}"
              git push origin "refs/tags/${TAG}"
              echo "Created and pushed tag ${TAG} on ${MERGE_SHA}"
            fi
          fi

      - name: Extract release notes from committed CHANGELOG.md
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node scripts/generate-changelog.mjs --notes "${VERSION}" > /tmp/release-notes.md

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists — skipping."
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file /tmp/release-notes.md
          fi
