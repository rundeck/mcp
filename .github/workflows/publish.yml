name: Publish to npm

# Disabled: migrated to .circleci/config.yml (npm-publish job).
# Kept here for reference only — if dispatched manually, it must be run
# against a `vX.Y.Z` tag ref (Actions UI "Use workflow from" -> tag). The
# version step parses GITHUB_REF_NAME as a tag and will fail/produce a
# non-semver version if dispatched against a branch.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Set package version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
