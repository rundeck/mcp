services:
  rundeck-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: rundeck/rundeck-mcp:latest
    container_name: rundeck-mcp
    environment:
      - RUNDECK_URL=${RUNDECK_URL:?RUNDECK_URL is required}
      - RUNDECK_TOKEN=${RUNDECK_TOKEN:?RUNDECK_TOKEN is required}
      - RUNDECK_API_VERSION=${RUNDECK_API_VERSION:-46}
      - SKIP_RUNDECK_DOCS_DOWNLOAD=${SKIP_RUNDECK_DOCS_DOWNLOAD:-}
      - RUNDECK_DOCS_BRANCH=${RUNDECK_DOCS_BRANCH:-4.0.x}
    stdin_open: true
    tty: true

# Usage:
# ------
# 1. Set credentials:
#    export RUNDECK_URL=https://your-rundeck.example.com
#    export RUNDECK_TOKEN=your-api-token
#
# 2. Run interactively (MCP stdio):
#    docker-compose run --rm rundeck-mcp
#
# 3. Or use directly from Claude Desktop / Claude Code .mcp.json:
#    {
#      "mcpServers": {
#        "rundeck-mcp": {
#          "command": "docker",
#          "args": ["run", "--rm", "-i",
#            "-e", "RUNDECK_URL=https://your-rundeck.example.com",
#            "-e", "RUNDECK_TOKEN=your-api-token",
#            "rundeck/rundeck-mcp:latest"
#          ]
#        }
#      }
#    }