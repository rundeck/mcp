version: 2.1

# Migrated from .github/workflows/docker-publish.yml and publish.yml.
#
# npm-publish authenticates via npm's OIDC trusted publishing (no NPM_TOKEN
# anywhere): `circleci run oidc get` mints a short-lived NPM_ID_TOKEN that npm
# exchanges for a publish token at request time. This requires a one-time,
# out-of-band setup on npmjs.com — Package Settings -> Trusted Publisher ->
# CircleCI, pointing at this org/project/workflow — and npm CLI >= 11.15.0,
# which is why every job pins cimg/node:24.18 (bundles npm 11.16.0) via
# .nvmrc/this file rather than relying on whatever npm an older Node bundles.
#
# DOCKERHUB_USERNAME/DOCKERHUB_TOKEN and CLOUDSMITH_NPM_TOKEN are NOT project
# env vars — they come from org-level CircleCI contexts, attached below:
#   - "Cloudsmith": build and docker-build (the only jobs running `npm ci`
#     directly). .npmrc points the registry at a private Cloudsmith mirror
#     (npm.artifacts.pd-internal.com) and package-lock.json's "resolved"
#     URLs point there directly, so without it npm ci fails to authenticate
#     — including inside the Dockerfile's builder stage, which is why
#     docker-build also forwards $CLOUDSMITH_NPM_TOKEN into the image build
#     via `docker buildx build --secret`. test and npm-publish don't run
#     `npm ci` themselves — they reuse build's node_modules/dist via
#     workspace attach (all three jobs now share the same cimg/node:24.18
#     image, so the artifacts are ABI-compatible) — so neither needs this
#     context.
#   - "Dockerhub": docker-build, docker-release (docker login).

commands:
  check_docker_secrets:
    description: Fail the job if Docker Hub credentials aren't configured
    steps:
      - run:
          name: Check required secrets (DOCKERHUB_USERNAME/DOCKERHUB_TOKEN)
          command: |
            if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
              echo "DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set — failing." >&2
              exit 1
            fi

  check_cloudsmith_secret:
    description: Fail the job if the Cloudsmith npm token isn't configured
    steps:
      - run:
          name: Check required secrets (CLOUDSMITH_NPM_TOKEN)
          command: |
            if [ -z "$CLOUDSMITH_NPM_TOKEN" ]; then
              echo "CLOUDSMITH_NPM_TOKEN not set — failing." >&2
              exit 1
            fi

jobs:
  # Stage 1: compile TypeScript — fast fail before spending time on test/docker/npm
  # Persists node_modules + dist so test and npm-publish (same cimg/node:24.18
  # image) can reuse them instead of re-installing/re-building from scratch.
  # Also persists docs/ — npm ci's postinstall (scripts/download-docs.mjs)
  # downloads the Rundeck docs there, and integration tests that exercise
  # resources/docs_search need them on disk to find anything.
  build:
    docker:
      - image: cimg/node:24.18
    steps:
      - checkout
      - check_cloudsmith_secret
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          # Bakes the release version into the User-Agent header at build time (see
          # src/tools/api.ts's USER_AGENT constant) so it's static in the published
          # dist/ — no runtime file reads. Only runs on tag builds; the version stays
          # "SNAPSHOT" for branch/PR builds. CIRCLE_TAG is validated against a strict
          # vX.Y.Z pattern first: git ref names may contain shell metacharacters like
          # $() or backticks, and CIRCLE_TAG is interpolated into a shell command
          # below, so an unvalidated tag would be a command-injection vector.
          name: Bake release version into User-Agent
          command: |
            if [ -n "${CIRCLE_TAG:-}" ]; then
              if ! echo "${CIRCLE_TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "CIRCLE_TAG '${CIRCLE_TAG}' does not match expected vX.Y.Z pattern — failing." >&2
                exit 1
              fi
              sed -i "s/rundeck-mcp\/SNAPSHOT/rundeck-mcp\/${CIRCLE_TAG#v}/" src/tools/api.ts
            fi
      - run:
          name: Build
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - node_modules
            - dist
            - docs

  # Stage 2: unit tests — reuses build's node_modules + docs via workspace
  # attach instead of running its own npm ci (ts-jest runs against src/
  # directly, so build's dist/ output itself isn't needed, just the
  # installed deps and downloaded docs).
  test:
    docker:
      - image: cimg/node:24.18
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run tests
          command: npm test

  # Stage 3a: build + push the CI image on every push/PR (mirrors the old
  # docker-publish.yml "build" job) — validates the Dockerfile before release.
  docker-build:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - check_docker_secrets
      - check_cloudsmith_secret
      - run:
          name: Docker login
          command: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Set up QEMU + Buildx
          command: |
            docker run --privileged --rm tonistiigi/binfmt --install all
            docker buildx create --use
      - run:
          # Single-platform (amd64, this machine's native arch), locally-loaded
          # build — buildx --push doesn't load into the local daemon, so it
          # can't be smoke-tested directly. --no-cache: the Dockerfile's
          # OSS-fallback build below shares this same npm-install RUN
          # instruction, and BuildKit's cache key for it does NOT include
          # CLOUDSMITH_NPM_TOKEN's presence — without --no-cache, this build
          # and the fallback one could silently reuse each other's (wrong)
          # resolved dependencies.
          name: Build local image for smoke test (with Cloudsmith)
          command: |
            docker build --no-cache --secret id=cloudsmith_token,env=CLOUDSMITH_NPM_TOKEN \
              -t rundeck-mcp:smoke-test .
      - run:
          name: Run Docker smoke tests (with Cloudsmith)
          command: sh ci/docker-smoke-test.sh rundeck-mcp:smoke-test
      - run:
          # Validates the Dockerfile's OSS/external-contributor fallback path
          # (no CLOUDSMITH_NPM_TOKEN) actually works, not just that it exists.
          name: Build local image for smoke test (OSS fallback, no Cloudsmith)
          command: docker build --no-cache -t rundeck-mcp:smoke-test-oss .
      - run:
          name: Run Docker smoke tests (OSS fallback)
          command: sh ci/docker-smoke-test.sh rundeck-mcp:smoke-test-oss
      - run:
          # arm64 is one of the two platforms actually pushed below (see
          # "Compute tag and build"); smoke-test it too, under the QEMU
          # emulation set up above, instead of only ever validating amd64.
          # Emulation makes this meaningfully slower, hence the looser budget.
          name: Build local image for smoke test (arm64, with Cloudsmith)
          command: |
            docker buildx build --no-cache --platform linux/arm64 --load \
              --secret id=cloudsmith_token,env=CLOUDSMITH_NPM_TOKEN \
              -t rundeck-mcp:smoke-test-arm64 .
      - run:
          name: Run Docker smoke tests (arm64)
          command: COLD_START_MAX_SECONDS=45 sh ci/docker-smoke-test.sh rundeck-mcp:smoke-test-arm64
      - run:
          name: Clean up local smoke-test images
          command: |
            docker rmi rundeck-mcp:smoke-test rundeck-mcp:smoke-test-oss rundeck-mcp:smoke-test-arm64 || true
      - run:
          name: Compute tag and build
          command: |
            # One tag per build: the git tag name on release pipelines
            # (immutable, same as a sha), otherwise the sanitized branch name.
            if [ -n "${CIRCLE_TAG:-}" ]; then
              IDENTIFIER="${CIRCLE_TAG}"
            else
              IDENTIFIER=$(echo "${CIRCLE_BRANCH}" | sed 's/[^a-zA-Z0-9._-]/-/g')
            fi
            TAG_ARGS=(-t "rundeck/mcp-ci:${IDENTIFIER}")
            # Only main builds move the `latest` tag — Runlayer pulls
            # mcp-ci:latest to run the MCP server internally, so PR/feature
            # branch builds must not be able to overwrite it.
            if [ "${CIRCLE_BRANCH:-}" = "main" ]; then
              TAG_ARGS+=(-t "rundeck/mcp-ci:latest")
            fi
            # --no-cache: the three smoke-test builds above (one of which runs
            # WITHOUT the token) share this same buildx builder/cache store.
            # --no-cache only skips *reading* cache, not writing it, so the
            # tokenless build still overwrote the npm-install layer's cache
            # entry — without --no-cache here too, THIS build (the one that
            # actually gets pushed) could silently reuse that wrong layer.
            docker buildx build --no-cache --platform linux/amd64,linux/arm64 --push \
              --secret id=cloudsmith_token,env=CLOUDSMITH_NPM_TOKEN \
              "${TAG_ARGS[@]}" .

  # Stage 3b: promote the CI image built above to the public release image.
  # Only runs on version tags — requires docker-build from the SAME pipeline
  # run (tag pushes re-run docker-build too), so the tag-named image is
  # guaranteed to exist rather than depending on an earlier push to main.
  docker-release:
    machine:
      image: ubuntu-2204:current
    steps:
      - check_docker_secrets
      - run:
          name: Docker login
          command: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Set up Buildx
          command: docker buildx create --use
      - run:
          name: Promote CI image to release
          command: |
            VERSION="${CIRCLE_TAG#v}"
            docker buildx imagetools create \
              --tag "rundeck/mcp:${VERSION}" \
              --tag "rundeck/mcp:latest" \
              "rundeck/mcp-ci:${CIRCLE_TAG}"

  # Stage 4: publish to npm via OIDC trusted publishing — no static NPM_TOKEN
  # is ever written to disk; `circleci run oidc get` mints a short-lived
  # NPM_ID_TOKEN that npm exchanges for a publish token at request time. Only
  # runs on version tags (mirrors docker-release) — never on plain branch or
  # PR builds, since a real `npm publish` requires a version bump and would
  # just fail otherwise.
  #
  # Reuses node_modules + dist from the build job (same cimg/node:24.18) via
  # workspace attach instead of re-running `npm ci`/`npm run build`; tests
  # were already verified by the test job, which this workflow requires
  # before npm-publish runs — so we don't re-run `npm test` either.
  npm-publish:
    docker:
      - image: cimg/node:24.18
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Set package version from tag
          command: npm version "${CIRCLE_TAG#v}" --no-git-tag-version --allow-same-version
      # The repo's own .npmrc points the generic "registry" at the Cloudsmith
      # mirror (needed for the build job's npm ci), but scopes an
      # "@rundeck:registry" override to the public npm registry — npm
      # resolves scope-specific registry config ahead of the generic
      # fallback, so publishing @rundeck/mcp goes to registry.npmjs.org
      # without needing an explicit --registry flag here.
      - run:
          name: Publish to npm (OIDC)
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npm publish --access public

workflows:
  build-test-publish:
    jobs:
      - build:
          context:
            - Cloudsmith
          filters:
            tags:
              only: /.*/
      - test:
          requires:
            - build
          filters:
            tags:
              only: /.*/
      - docker-build:
          context:
            - Dockerhub
            - Cloudsmith
          requires:
            - build
            - test
          filters:
            tags:
              only: /.*/
      - docker-release:
          context:
            - Dockerhub
          requires:
            - docker-build
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
      - npm-publish:
          requires:
            - build
            - test
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/